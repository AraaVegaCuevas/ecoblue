                        <div class="wow fadeInUp" data-wow-delay="0.2s">

                                <form action="https://api.web3forms.com/submit" method="post">

                                    <input type="hidden" name="access_key" value="efccd5f1-ae7c-4986-8ff2-eb0c01156bea">
                                    <input type="hidden" name="Origen" value="Formulario de Contacto - Página Consorcio Ecoterra-Blauemeer">

                                    <div class="row g-4">

                                        <div class="col-sm-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control border-0" id="name" aria-describedby="name" name="Nombre" placeholder="Tu nombre" required>
                                                <label for="name">Nombre *</label>
                                            </div>
                                        </div>

                                        <div class="col-sm-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control border-0" id="lastName" aria-describedby="lastName" name="Apellido" placeholder="Tu apellido" required>
                                                <label for="lastName">Apellido *</label>
                                            </div>
                                        </div>

                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="email" class="form-control border-0" id="email" aria-describedby="email" name="Correo Electrónico" placeholder="Tu correo electrónico" required>
                                                <label for="email">Correo electrónico *</label>
                                            </div>
                                        </div>

                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="number" class="form-control border-0" id="phone" aria-describedby="phone" name="Número Telefónico" placeholder="Tu número telefónico" required>
                                                <label for="phone">Número Telefónico *</label>
                                            </div>
                                        </div>

                                        <div class="col-12">
                                            <div class="form-floating subject-field">

                                                <select class="form-control border-0 subject-select"
                                                        name="Asunto"
                                                        id="subject"
                                                        required>
                                                    <option disabled selected value>Selecciona una opción...</option>
                                                    <option value="Ventas">Ventas</option>
                                                    <option value="Cotización">Cotización</option>
                                                    <option value="Información sobre productos">Información sobre productos</option>
                                                    <option value="Otros">Otros</option>
                                                </select>

                                                <label for="subject">Asunto *</label>

                                            </div>
                                        </div>



                                        <div class="col-12">
                                            <div class="form-floating">
                                                <textarea class="form-control border-0" id="message" name="Mensaje" placeholder="Deja tu mensaje aquí" style="height: 160px" required></textarea>
                                                <label for="message">Mensaje *</label>
                                            </div>

                                        </div>

                                        <div class="col-12">
                                            <button type="submit" class="btn btn-primary w-100 py-3">Enviar Mensaje</button>
                                        </div>

                                    </div>
                                </form>
                            </div>
                        </div>
